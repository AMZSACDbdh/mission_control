name: Desktop CI

# Produces a signed-free NSIS installer for Windows on every push to main
# and on every pull request. Manual dispatch available for ad-hoc builds.
#
# Job order:
#   1. npm ci               – install JS/TS dependencies
#   2. npm run check        – typecheck + ESLint + 634 adversarial tests  (fast fail)
#   3. npm run tauri:build  – runs build:spa then compiles Rust and bundles NSIS
#   4. Upload artifact      – .exe installer, kept for 30 days

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ────────────────────────────────────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── Rust ───────────────────────────────────────────────────────────────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cache compiled crates keyed on Cargo.lock + OS so incremental builds
      # skip unchanged dependencies (first build: ~15 min → cached: ~3 min).
      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ── JS checks (fast — fail before spending Rust compile time) ──────────
      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, lint and 634 tests
        run: npm run check

      # ── Tauri build (slow — Rust compile + NSIS bundle) ───────────────────
      # tauri:build internally runs beforeBuildCommand (npm run build:spa)
      # then compiles the Rust binary and packages an NSIS installer.
      - name: Build NSIS installer
        run: npm run tauri:build

      # ── Publish artefact ───────────────────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
