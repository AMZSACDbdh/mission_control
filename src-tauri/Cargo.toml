[package]
name = "mission-control"
version = "0.1.0"
description = "Mission Control — desktop discipline tracker"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mission_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
# Writes HKCU\Software\Microsoft\Windows\CurrentVersion\Run — a per-user key, so
# registering for startup never needs elevation.
tauri-plugin-autostart = "2"
# Guards against a second process opening the same store file. Its Windows
# implementation is a named mutex scoped to the session.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
